  </defs>

  <rect width="800" height="260" fill="url(#sky)"/>

  <circle cx="690" cy="60" r="46" fill="url(#sun)" opacity="0.9"/>

  <!-- Силуэты города -->
  <g fill="#1f5fbf" opacity="0.55">
    <rect x="20" y="130" width="34" height="90"/>
    <rect x="60" y="100" width="28" height="120"/>
    <rect x="94" y="150" width="40" height="70"/>
    <rect x="140" y="115" width="26" height="105"/>
    <rect x="600" y="140" width="30" height="80"/>
    <rect x="636" y="110" width="24" height="110"/>
    <rect x="666" y="160" width="36" height="60"/>
  </g>

  <!-- Дорога -->
  <rect x="0" y="205" width="800" height="55" fill="#25324a"/>
  <g fill="#f4f6fb">
    <rect x="40" y="228" width="46" height="8" rx="4"/>
    <rect x="140" y="228" width="46" height="8" rx="4"/>
    <rect x="240" y="228" width="46" height="8" rx="4"/>
    <rect x="340" y="228" width="46" height="8" rx="4"/>
    <rect x="440" y="228" width="46" height="8" rx="4"/>
    <rect x="540" y="228" width="46" height="8" rx="4"/>
    <rect x="640" y="228" width="46" height="8" rx="4"/>
    <rect x="740" y="228" width="46" height="8" rx="4"/>
  </g>

  <!-- Машина -->
  <g transform="translate(300,150)">
    <rect x="0" y="30" width="150" height="34" rx="12" fill="#ffffff"/>
    <path d="M14 30 C22 8 40 0 68 0 H100 C118 0 128 8 136 30 Z" fill="#ffffff"/>
    <path d="M28 26 C34 12 44 8 66 8 H92 C106 8 112 12 118 26 Z" fill="#8fc4ff"/>
    <circle cx="35" cy="66" r="16" fill="#20283a"/>
    <circle cx="35" cy="66" r="6" fill="#c9d3e0"/>
    <circle cx="118" cy="66" r="16" fill="#20283a"/>
    <circle cx="118" cy="66" r="6" fill="#c9d3e0"/>
    <rect x="-6" y="40" width="10" height="8" rx="3" fill="#ffd23f"/>
    <rect x="146" y="40" width="10" height="8" rx="3" fill="#ff5a5a"/>
