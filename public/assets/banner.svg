  <text x="40" y="70" font-family="Verdana, Arial, sans-serif" font-size="34" font-weight="bold" fill="#ffffff">Поехали 74</text>
  <text x="40" y="96" font-family="Verdana, Arial, sans-serif" font-size="16" fill="#eaf3ff">Челябинск ⇄ Кунашак ⇄ Аргаяш</text>
  <text x="40" y="118" font-family="Verdana, Arial, sans-serif" font-size="16" fill="#eaf3ff">попутчики без фейков</text>
</svg>
